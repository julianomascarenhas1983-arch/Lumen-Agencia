[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/diagnostico"
  to = "/.netlify/functions/diagnostico"
  status = 200
  force = true

[[redirects]]
  from = "/api/diagnostico/*"
  to = "/.netlify/functions/diagnostico"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
